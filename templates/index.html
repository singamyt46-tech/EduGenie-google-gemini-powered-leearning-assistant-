<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduGenie - Learning Assistant</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='style.css') }}"
    >
</head>

<body>

    <header class="header">
        <div class="container">
            <h1>🎓 EduGenie</h1>
            <p>Google Gemini Powered Learning Assistant</p>
        </div>
    </header>


    <main class="container">

        <!-- Question & Answer -->
        <section class="card">

            <h2>💬 Ask a Question</h2>

            <textarea
                id="qaQuestion"
                placeholder="Ask any educational question..."
            ></textarea>

            <button onclick="askQuestion()">
                Get Answer
            </button>

            <div
                id="qaResult"
                class="result"
            ></div>

        </section>


        <!-- Topic Explanation -->
        <section class="card">

            <h2>📚 Explain a Topic</h2>

            <input
                type="text"
                id="explainTopic"
                placeholder="Enter a topic..."
            >

            <select id="explainLevel">
                <option value="beginner">Beginner</option>
                <option value="intermediate">Intermediate</option>
                <option value="advanced">Advanced</option>
            </select>

            <button onclick="explainTopic()">
                Explain Topic
            </button>

            <div
                id="explainResult"
                class="result"
            ></div>

        </section>


        <!-- Quiz Generator -->
        <section class="card">

            <h2>📝 Generate Quiz</h2>

            <textarea
                id="quizText"
                placeholder="Paste educational text here..."
            ></textarea>

            <button onclick="generateQuiz()">
                Generate Quiz
            </button>

            <div
                id="quizResult"
                class="result"
            ></div>

        </section>


        <!-- Summarizer -->
        <section class="card">

            <h2>📖 Summarize Text</h2>

            <textarea
                id="summaryText"
                placeholder="Paste text to summarize..."
            ></textarea>

            <button onclick="summarizeText()">
                Summarize
            </button>

            <div
                id="summaryResult"
                class="result"
            ></div>

        </section>


        <!-- Learning Path -->
        <section class="card">

            <h2>🛤️ Personalized Learning Path</h2>

            <input
                type="text"
                id="learningTopic"
                placeholder="Enter a topic..."
            >

            <select id="learningLevel">
                <option value="beginner">Beginner</option>
                <option value="intermediate">Intermediate</option>
                <option value="advanced">Advanced</option>
            </select>

            <button onclick="getLearningPath()">
                Create Learning Path
            </button>

            <div
                id="learningResult"
                class="result"
            ></div>

        </section>

    </main>


    <footer>
        <p>EduGenie © 2026 | AI Learning Assistant</p>
    </footer>


    <script
        src="{{ url_for('static', path='app.js') }}"
    ></script>

</body>
</html>
